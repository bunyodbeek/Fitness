{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shredzville</title>
  <!-- Telegram WebApp SDK — <head> ichida SINxron, app kodidan OLDIN yuklanadi. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    window.__AUTH_URL = "{% url 'auth_telegram' %}";
    window.__BOT_DEEPLINK = "{{ telegram_bot_url|escapejs }}";
  </script>
  <script src="{% static 'js/tg_auth.js' %}"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; height: 100vh; overflow: hidden; }
    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

<video autoplay muted playsinline id="introVideo">
  <source src="{% static 'apps/videos/INTRO.mp4' %}" type="video/mp4">
</video>

<script src="{% static 'js/tg_viewport.js' %}"></script>
<script>
  var _defaultUrl = "{% url 'program_list' %}";

  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

  // start_param — bu autentifikatsiya ma'lumoti EMAS (import deep-link marshruti),
  // shuning uchun uni initDataUnsafe'dan o'qish mumkin.
  (function() {
    try {
      var startParam = tg ? (tg.initDataUnsafe || {}).start_param || '' : '';
      if (startParam.indexOf('import_') === 0) {
        var token = startParam.slice(7).toUpperCase();
        var lang = window.location.pathname.match(/^\/(en|ru|uz)\//)?.[1] || 'uz';
        _defaultUrl = '/' + lang + '/programs/import/' + token + '/';
      }
    } catch(e) {}
  })();

  // Kirish nuqtasida imzolangan initData ni backendga yuborib sessiya ochamiz —
  // shunda himoyalangan sahifalar (profil, premium, favorites) birinchi bosishdayoq
  // ochiladi. Foydalanuvchi ID hech qachon initDataUnsafe'dan o'qilmaydi.
  // initData bo'sh bo'lsa (silent) reopen ekranini bu yerda ko'rsatmaymiz — auth
  // questionnaire/keyingi sahifada qayta urinib ko'riladi.
  var authPromise = TgAuth.authenticate({ silent: true })
    .catch(function(e) { console.error('Auth error:', e); });

  // Sessiya o'rnatilmaguncha redirect qilmaymiz (video tugashi bilan auth tugashini
  // ikkalasini ham kutamiz). Video umuman o'ynamasa, 6s dan keyin baribir o'tamiz.
  var redirected = false;
  function go() {
    if (redirected) return;
    redirected = true;
    authPromise.then(function() { window.location.href = _defaultUrl; });
  }

  document.getElementById('introVideo').addEventListener('ended', go);
  setTimeout(go, 6000);
</script>

</body>
</html>
